<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Weights — AI Strength & Cardio Coach</title>
  <meta name="description" content="Science-backed AI gym coach for Manegg Motion with 2D floor plan routing, maximal strength & VO2max periodization, and Garmin Venu 4s live heart rate." />
  <meta name="theme-color" content="#111317" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button type="button" id="goal-chip-btn" class="brand-goal-btn" data-action="open-goal-modal" aria-label="Goals and Mesocycle Plan">
        <span class="brand-mark" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 6.5v11" stroke="var(--accent)"/>
            <path d="M17.5 6.5v11" stroke="var(--accent)"/>
            <path d="M3.5 9v6"/>
            <path d="M20.5 9v6"/>
            <path d="M6.5 12h11"/>
          </svg>
        </span>
        <span class="brand-copy">
          <span class="brand-title-line">
            <span class="brand-name-text">Weights</span>
            <span id="header-meso-tag" class="meso-tag">W1 · Max Strength</span>
          </span>
        </span>
      </button>

      <div class="header-actions">
        <button type="button" id="floor-map-btn" class="icon-btn" data-action="open-floor-modal" aria-label="Gym Floor Plan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
            <line x1="9" y1="3" x2="9" y2="18"/>
            <line x1="15" y1="6" x2="15" y2="21"/>
          </svg>
        </button>

        <button type="button" id="wearable-btn" class="hr-pill-btn" data-action="open-wearable-modal" aria-label="Heart Rate Watch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          </svg>
          <span id="wearable-btn-label">Venu 4s</span>
        </button>

        <button type="button" id="open-menu-btn" class="icon-btn" data-action="open-plan-modal" aria-label="Session Queue and Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="7" x2="20" y2="7"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="17" x2="20" y2="17"/>
          </svg>
        </button>
      </div>
    </header>

    <h1 class="sr-only">Weights AI Strength and Cardiovascular Coach</h1>

    <main id="app-main" class="app-main" aria-live="polite"></main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-title">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title"></h2>
        <button type="button" id="close-modal-btn" class="icon-btn is-sm" data-action="close-modal" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
